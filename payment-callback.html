<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Verification | SKDOT UNISEX SALON</title><link rel="stylesheet" href="style.css?v=31"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/skdot-logo-exact.jpeg" alt="SKDOT logo"><span>SKDOT UNISEX SALON</span></a></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">SKDOT · PAYMENT</div><h1>Verifying your payment.</h1><p id="payment-message">Please wait while we confirm your Paystack transaction securely.</p></div></section><section class="section"><div class="container form-wrap" id="payment-result"><p>Checking payment status…</p></div></section></main><script>
(async()=>{const box=document.getElementById('payment-result');const msg=document.getElementById('payment-message');const ref=new URLSearchParams(location.search).get('reference');if(!ref){msg.textContent='No payment reference was supplied.';box.innerHTML='<div class="notice">Please return to checkout or contact SKDOT on WhatsApp.</div>';return}try{const r=await fetch('/.netlify/functions/verify-payment?reference='+encodeURIComponent(ref));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Verification failed');if(d.paid){msg.textContent='Payment confirmed.';box.innerHTML='<div class="success-panel"><h2>Payment successful</h2><p>Order <strong>'+d.order.id+'</strong> has been confirmed.</p><p>Payment status: <strong>Paid</strong></p><p>Keep your order number for tracking.</p><a class="btn btn-gold" href="track.html?order='+encodeURIComponent(d.order.id)+'">Track order</a></div>';}else{msg.textContent='Payment was not confirmed.';box.innerHTML='<div class="notice"><strong>Payment not confirmed.</strong><p>Do not place another order yet. Contact SKDOT if you believe you were charged.</p><a class="btn btn-gold" href="https://wa.me/2349064653935">Contact SKDOT</a></div>';}}catch(e){msg.textContent='We could not verify the payment right now.';box.innerHTML='<div class="notice"><strong>Verification unavailable.</strong><p>'+String(e.message||e)+'</p><p>Please contact SKDOT before attempting another payment.</p></div>';}})();
</script></body></html>
